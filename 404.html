<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex">
<title>404 – Seite nicht gefunden · Tippo</title>
<style>
:root{--bg:#F6F4EE;--card:#fff;--ink:#141414;--mut:#6D6A63;--line:#E4DFD3;--acc:#D97757;--accInk:#fff;--gold:#C8A96A;
--disp:"Bahnschrift","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;--ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0E0E0F;--card:#18181A;--ink:#F4F1EA;--mut:#9A968D;--line:#2B2B2E;--acc:#E8896A;--accInk:#141414}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(18px,5vw,56px);background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
main{width:100%;max-width:720px}
.keys{display:flex;gap:clamp(8px,2vw,16px);margin-bottom:clamp(24px,5vw,44px)}
.key{flex:1;max-width:190px;aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-bottom-width:8px;border-radius:clamp(16px,3vw,28px);background:var(--card);font:700 clamp(64px,18vw,150px)/1 var(--disp);font-stretch:condensed;font-variation-settings:"wdth" 78}
.key.on{background:var(--acc);border-color:var(--acc);color:var(--accInk);transform:translateY(5px);border-bottom-width:3px}
h1{margin:0 0 12px;font:700 clamp(32px,6vw,52px)/1.05 var(--disp);font-stretch:condensed;font-variation-settings:"wdth" 78;text-transform:uppercase}
p{margin:0 0 28px;max-width:52ch;color:var(--mut);font-size:clamp(16px,2vw,18px)}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border:2px solid transparent;border-radius:999px;background:var(--acc);color:var(--accInk);font:700 19px var(--disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;cursor:pointer}
.pill.l{background:transparent;color:var(--ink);border-color:var(--line)}.pill.l:hover{border-color:var(--ink)}
.pill:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media(max-width:480px){.pill{width:100%}}
</style></head><body>
<main>
<div class="keys" aria-hidden="true"><span class="key">4</span><span class="key on">0</span><span class="key">4</span></div>
<h1>Seite nicht gefunden</h1>
<p>Diese Adresse gibt es nicht oder die Seite wurde verschoben. Prüfe den Link oder geh zurück zum Schreibtraining.</p>
<div class="acts"><a class="pill" id="home" href="/">Zur Startseite</a><button class="pill l" id="back" type="button">Zurück</button></div>
</main>
<script>
(function(){
 var a=document.getElementById("home"),b=document.getElementById("back"),seg=location.pathname.split("/").filter(Boolean)[0];
 b.onclick=function(){history.back()};if(history.length<2)b.hidden=true;
 if(location.protocol==="file:"){a.href="index.html";return}
 if(!/\.github\.io$/.test(location.hostname)||!seg){a.href="/";return}
 a.href="/"+seg+"/";
 fetch("/"+seg+"/index.html",{method:"HEAD"}).then(function(r){if(!r.ok)a.href="/"}).catch(function(){});
})();
</script></body></html>
